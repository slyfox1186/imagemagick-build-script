[project]
name = "imagemagick-build-script"
version = "3.0.0"
description = "Builds ImageMagick and its dependencies from source on Debian and Ubuntu"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = ["pytest==9.1.1", "ruff==0.16.8", "mypy==2.3.1"]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["magick_builder*"]

[tool.ruff]
target-version = "py312"
line-length = 100
include = ["build-magick.py", "run_linter.py", "magick_builder/**/*.py", "tests/**/*.py", "tools/**/*.py"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["build-magick.py", "run_linter.py", "magick_builder", "tools", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
