# Copy this template to custom.toml, edit it, and then run:
# python3 build-magick.py --build --config ./custom.toml
#
# This project accepts a deliberately small TOML subset:
#   [build]
#   [packages]
#   key = true|false
#
# Package entries are an explicit allowlist: an omitted key is DISABLED.
# This file lists every supported key set to true, which reproduces the
# default full build. Every key names a component this script builds from
# source; a true value builds it into the workspace and (where the
# component provides an ImageMagick delegate) requires that delegate in
# the final validated install. A false value skips the build and passes an
# explicit --without flag to ImageMagick's configure, so a stray system
# dev package cannot silently re-enable it.
#
# The APT baseline is not configurable here: the system packages that
# provide the bzlib/gvc/heic/jbig/lzma/rsvg/zlib/zstd delegates (plus the
# djvu/fftw/lqr/openexr/pango/raw/wmf/zip extras and the gs/ffmpeg runtime
# delegates) are always installed.
#
# The groups below are for readability, with package keys alphabetized
# inside each group. They do not control build order; the builder fixes the
# build order itself. Some selections are impossible and fail up front: the
# raqm text stack needs freetype, fribidi, and harfbuzz; fontconfig needs
# freetype and libxml2; libtiff needs libjpeg-turbo.
#
# The active selection is recorded in the build context. Changing it
# invalidates the completion markers and the workspace automatically on
# the next run - no manual cleanup is needed.

[build]
# Recheck upstream releases and rebuild components whose recorded versions
# differ. The --latest command-line flag overrides this key.
latest = false

[packages]

# Build tools (disabling one falls back to the APT-installed version)
libtool = true  # Portable library build and linking helper
m4 = true  # Macro processor used by Autotools
pkg-config = true  # Dependency resolver used by every configure probe

# Image format libraries and their delegates
ghostscript = true  # PostScript/PDF library (gslib delegate)
libfpx = true  # FlashPix format support (fpx delegate)
libjpeg-turbo = true  # JPEG encoding/decoding (jpeg delegate; jng with libpng)
libpng = true  # PNG encoding/decoding (png delegate; jng with libjpeg-turbo)
libtiff = true  # TIFF encoding/decoding (tiff delegate; needs libjpeg-turbo)
libwebp = true  # WebP encoding/decoding (webp delegate)
openjpeg = true  # JPEG 2000 encoding/decoding (jp2 delegate)

# Text rendering stack
fontconfig = true  # Font discovery (fontconfig delegate; needs freetype+libxml2)
freetype = true  # Font loading and rasterization (freetype delegate)
fribidi = true  # Unicode bidirectional text (required by raqm)
harfbuzz = true  # Complex text shaping (needs freetype; required by raqm)
libxml2 = true  # XML parsing (xml delegate; required by fontconfig)
raqm = true  # Complex text layout (raqm delegate; needs freetype/fribidi/harfbuzz)

# Color management, memory, and GPU support
jemalloc = true  # General-purpose memory allocator (--with-jemalloc)
lcms2 = true  # ICC color management with Little CMS (lcms delegate)
opencl-sdk = true  # Khronos OpenCL headers and loader (--enable-opencl)

# Font families installed to /usr/share/fonts/truetype (DejaVu comes from
# the fonts-dejavu-core APT package and is not listed here)
Fira = true  # Mozilla Fira
roboto = true  # Google Roboto
source-code-pro = true  # Adobe Source Code Pro
source-sans-pro = true  # Adobe Source Sans
source-serif-pro = true  # Adobe Source Serif

# Final application
imagemagick = true  # ImageMagick itself (disable to build only the dependencies)
